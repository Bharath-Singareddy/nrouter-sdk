name: SDK Health

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-health
  cancel-in-progress: false

env:
  NROUTER_LIVE: '1'
  NROUTER_API_KEY: ${{ secrets.NROUTER_SDK_MONITOR_API_KEY }}
  NROUTER_BASE_URL: https://api.nrouter.ai/v1
  NROUTER_LIVE_CHAT_MODEL: ${{ vars.NROUTER_LIVE_CHAT_MODEL }}
  NROUTER_LIVE_RESPONSES_MODEL: ${{ vars.NROUTER_LIVE_RESPONSES_MODEL }}
  NROUTER_LIVE_OPAQUE_MODEL: ${{ vars.NROUTER_LIVE_OPAQUE_MODEL }}

jobs:
  python:
    name: Python live canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Verify canary configuration
        run: |
          test -n "$NROUTER_API_KEY"
          test -n "$NROUTER_LIVE_CHAT_MODEL"
          test -n "$NROUTER_LIVE_RESPONSES_MODEL"
          test -n "$NROUTER_LIVE_OPAQUE_MODEL"

      - name: Install SDK test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run billed acceptance probes
        run: python -m pytest -q tests/test_live.py --junitxml=python-live.xml

      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-live-result
          path: sdks/python/python-live.xml
          if-no-files-found: warn

  rust:
    name: Rust live canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify canary configuration
        run: |
          test -n "$NROUTER_API_KEY"
          test -n "$NROUTER_LIVE_CHAT_MODEL"
          test -n "$NROUTER_LIVE_RESPONSES_MODEL"
          test -n "$NROUTER_LIVE_OPAQUE_MODEL"

      - name: Run billed acceptance probes
        run: |
          set -o pipefail
          for attempt in 1 2 3; do cargo test --locked --test live -- --ignored --nocapture 2>&1 | tee -a rust-live.txt && exit 0; test "$attempt" -eq 3 || sleep "$((attempt * 5))"; done; exit 1

      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-live-result
          path: sdks/rust/rust-live.txt
          if-no-files-found: warn

  android:
    name: Android live canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3

      - name: Install Android SDK components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'

      - name: Verify canary configuration
        run: test -n "$NROUTER_API_KEY"

      - name: Publish Kotlin core locally
        working-directory: sdks/kotlin
        run: ./gradlew publishToMavenLocal

      - name: Run billed Android acceptance probe
        working-directory: sdks/android
        run: ./gradlew testDebugUnitTest --tests 'ai.nrouter.sdk.android.LiveTest'

      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-live-result
          path: sdks/android/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  result:
    name: SDK health result
    if: ${{ always() }}
    needs: [python, rust, android]
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo '## SDK health'
            echo '| SDK | Result |'
            echo '| --- | --- |'
            echo '| Python | ${{ needs.python.result }} |'
            echo '| Rust | ${{ needs.rust.result }} |'
            echo '| Android | ${{ needs.android.result }} |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when a canary failed
        if: ${{ needs.python.result != 'success' || needs.rust.result != 'success' || needs.android.result != 'success' }}
        run: exit 1
